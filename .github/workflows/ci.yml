name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: 客户端（lint / test / build / pack）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vitest 5 硬性要求 Node ≥ 22.12；与根 .nvmrc / engines 锁定的 24 对齐
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 单元测试 + 覆盖率门槛
        run: npx vitest run --coverage

      - name: 契约校验
        run: node scripts/verify-client-contract.mjs

      - name: 库构建（ESM/CJS + d.ts）
        run: npm run build

      - name: 打包 dry-run（校验 files/exports）
        run: npm pack --dry-run

  server:
    name: 参考服务端（node --test + 覆盖率门槛）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与根 .nvmrc(24) / engines 对齐；better-sqlite3 按此 Node 版本原生编译
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        run: npm --prefix server ci

      - name: 服务端测试 + 覆盖率门槛
        # `test` 内含 node --experimental-test-coverage，未达门槛（行80/分支65/函数80）即非零退出
        run: npm --prefix server test
