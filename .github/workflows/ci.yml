name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: 客户端（lint / test / build / pack）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vitest 5 硬性要求 Node ≥ 22.12；与根 .nvmrc / engines 锁定的 24 对齐
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生产依赖安全审计
        # 仅查生产依赖；当前 0 漏洞。出现高危/严重即非零退出阻断 CI
        run: npm audit --omit=dev

      - name: ESLint
        run: npm run lint

      - name: 单元测试 + 覆盖率门槛
        run: npx vitest run --coverage

      - name: 契约校验
        run: node scripts/verify-client-contract.mjs

      - name: 库构建（ESM/CJS + d.ts）
        run: npm run build

      - name: 打包 dry-run（校验 files/exports）
        run: npm pack --dry-run

  server:
    name: 参考服务端（node --test + 覆盖率门槛）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与根 .nvmrc(24) / engines 对齐；better-sqlite3 按此 Node 版本原生编译
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        run: npm --prefix server ci

      - name: 生产依赖安全审计（高危及以上阻断）
        # 仅查生产依赖；`--audit-level=high` 允许 sequelize 传递的 uuid 中危残留
        # （修复需 sequelize 降至 3.x 破坏性变更，D1 明确禁止 --force，故保留）
        run: npm --prefix server audit --omit=dev --audit-level=high

      - name: 服务端测试 + 覆盖率门槛 + e2e 冒烟
        # `verify` = `test`（含 node --experimental-test-coverage 门槛 行80/分支65/函数80）
        #   + `e2e`（真实服务端 round-trip：上传→合并→分片下载→重组→md5 比对）
        run: npm --prefix server run verify
