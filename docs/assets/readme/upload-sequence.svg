<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-label="上传链路时序图">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .hdr{fill:#eef4ff;stroke:#8fb3e8;stroke-width:1.2}
      .t{font:13px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2328;text-anchor:middle}
      .m{stroke:#57606a;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .r{stroke:#8c959f;stroke-width:1.2;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
      .life{stroke:#d0d7de;stroke-width:1.2;stroke-dasharray:4 5}
      .lb{font:11.5px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2328;text-anchor:middle}
      .note{fill:#fff8e6;stroke:#d4a72c;stroke-width:1}
      .nt{font:11.5px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#7d4e00}
    </style>
  </defs>
  <rect width="1080" height="700" fill="#ffffff"/>

  <!-- 参与者 -->
  <rect class="hdr" x="30" y="16" width="140" height="40"/>
  <text class="t" x="100" y="41">用户</text>
  <rect class="hdr" x="250" y="16" width="140" height="40"/>
  <text class="t" x="320" y="41">前端模块</text>
  <rect class="hdr" x="470" y="16" width="140" height="40"/>
  <text class="t" x="540" y="41">Upload Worker</text>
  <rect class="hdr" x="690" y="16" width="140" height="40"/>
  <text class="t" x="760" y="41">IndexedDB</text>
  <rect class="hdr" x="910" y="16" width="140" height="40"/>
  <text class="t" x="980" y="41">服务端 API</text>

  <line class="life" x1="100" y1="56" x2="100" y2="660"/>
  <line class="life" x1="320" y1="56" x2="320" y2="660"/>
  <line class="life" x1="540" y1="56" x2="540" y2="660"/>
  <line class="life" x1="760" y1="56" x2="760" y2="660"/>
  <line class="life" x1="980" y1="56" x2="980" y2="660"/>

  <!-- 1 -->
  <text class="lb" x="210" y="104">选择文件</text>
  <path class="m" d="M100 110 L316 110"/>
  <!-- 2 自处理说明 -->
  <rect class="note" x="330" y="128" width="200" height="40"/>
  <text class="nt" x="338" y="145">自动策略：网络状态 → chunkSize</text>
  <text class="nt" x="338" y="161">+ 文件 / 分片并发度</text>
  <!-- 3 -->
  <text class="lb" x="430" y="192">自动入队并启动上传</text>
  <path class="m" d="M320 198 L536 198"/>
  <!-- 4 -->
  <text class="lb" x="650" y="236">保存队列与分片状态</text>
  <path class="m" d="M540 242 L756 242"/>
  <!-- 5 -->
  <text class="lb" x="760" y="280">POST /instant（秒传 / 分片检查）</text>
  <path class="m" d="M540 286 L976 286"/>
  <!-- 6 -->
  <text class="lb" x="760" y="324">uploaded=true（秒传）或缺失分片</text>
  <path class="r" d="M980 330 L544 330"/>
  <!-- 7 -->
  <text class="lb" x="760" y="368">POST /upload（缺失分片，循环）</text>
  <path class="m" d="M540 374 L976 374"/>
  <!-- 8 -->
  <text class="lb" x="650" y="412">持久化分片进度</text>
  <path class="m" d="M540 418 L756 418"/>
  <!-- 9 -->
  <text class="lb" x="760" y="456">POST /merge（合并 + 整文件校验）</text>
  <path class="m" d="M540 462 L976 462"/>
  <!-- 10 -->
  <text class="lb" x="430" y="500">文件完成事件 onUploadComplete</text>
  <path class="r" d="M540 506 L324 506"/>
  <!-- 11 -->
  <text class="lb" x="650" y="544">GET /list（业务侧按需刷新，库内不做）</text>
  <path class="m" d="M320 550 L976 550"/>
  <!-- 12 -->
  <text class="lb" x="320" y="600">autoCleanup=true：按 cleanupPolicy 延迟清理成功项，失败项保留</text>
</svg>
